name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          if ! git branch --contains "$TAG" --remotes | grep -qE 'origin/main$'; then
            echo "Tag $TAG is not reachable from origin/main. Refusing to release." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build debug AAB
        run: ./gradlew :app:bundleDebug --stacktrace --no-daemon

      - name: Rename artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/RO-CEI-Reader-${TAG}-debug.apk"
          mv app/build/outputs/bundle/debug/app-debug.aab "app/build/outputs/bundle/debug/RO-CEI-Reader-${TAG}-debug.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/RO-CEI-Reader-${{ github.ref_name }}-debug.apk
            app/build/outputs/bundle/debug/RO-CEI-Reader-${{ github.ref_name }}-debug.aab
